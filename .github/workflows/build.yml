name: Build

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/reside-ic/proxy-nginx
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch,prefix=${{ github.ref_name == 'latest' && 'branch-' || '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.repository == 'reside-ic/proxy-nginx'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' && github.ref_type == 'branch' && github.repository == 'reside-ic/proxy-nginx' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
